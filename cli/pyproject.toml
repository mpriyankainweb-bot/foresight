[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight-cli"
version = "0.1.0"
description = "Foresight Deploy-Safety CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
foresight = "foresight_cli.main:cli"
