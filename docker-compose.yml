version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FORESIGHT_MODE=${FORESIGHT_MODE:-offline}
      - API_KEY=${API_KEY:-foresight-secret-key-123}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HINDSIGHT_API_KEY=${HINDSIGHT_API_KEY:-}
      - HINDSIGHT_BANK_ID=${HINDSIGHT_BANK_ID:-foresight-paynest}
    env_file:
      - .env.example

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FORESIGHT_API_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
